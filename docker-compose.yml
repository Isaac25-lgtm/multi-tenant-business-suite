# Local PostgreSQL for development and tests, matching production's major version.
#   docker compose up -d
# Then in backend/.env:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5433/denove_aps
#   TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/denove_aps_test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: denove_aps
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
